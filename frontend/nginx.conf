# Pass the original scheme through when a reverse proxy (TLS) sits in front,
# so the backend can mark its login cookie Secure on https.
map $http_x_forwarded_proto $sd_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $sd_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    location /callback { try_files $uri /index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
