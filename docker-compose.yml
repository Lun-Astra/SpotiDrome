services:
  frontend:
    # Prebuilt image (updated weekly by GitHub Actions); `docker compose up -d --build`
    # builds it from ./frontend instead.
    image: ghcr.io/lun-astra/spotidrome-frontend:latest
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped

  backend:
    image: ghcr.io/lun-astra/spotidrome-backend:latest
    build:
      context: ./backend
      # Local builds: `APP_COMMIT=$(git rev-parse HEAD) docker compose up -d --build`
      # lets Settings > Check for updates know which version is running.
      args:
        APP_COMMIT: ${APP_COMMIT:-}
    ports:
      # Only reachable from this host: the reverse proxy and
      # everything else go through the frontend's /api/ on :8080 (which adds
      # the security headers), and the backend checks login/API key itself.
      - "127.0.0.1:5000:5000"
    depends_on:
      - bgutil-pot
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - NAVIDROME_URL=${NAVIDROME_URL}
      - NAVIDROME_USER=${NAVIDROME_USER}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD}
      - SSH_HOST=${SSH_HOST}
      - SSH_USER=${SSH_USER}
      - SSH_PORT=${SSH_PORT:-22}
      - SSH_MUSIC_PATH=${SSH_MUSIC_PATH}
      - DISCOVER_MUSIC_PATH=${DISCOVER_MUSIC_PATH:-}
      - DISCOVER_NAVIDROME_PATH=${DISCOVER_NAVIDROME_PATH:-}
      - REMOTE_SCAN_TIMEOUT=${REMOTE_SCAN_TIMEOUT:-3600}
    deploy:
      resources:
        limits:
          cpus: "2.0"
    volumes:
      - ~/.ssh:/root/.ssh
      - /tmp/spotidrome:/downloads
    restart: unless-stopped

  # Settings > Update now: the only container with the Docker socket, and it
  # has no network port. The backend asks it for an update through a file in
  # the shared state folder; see updater/updater.sh.
  updater:
    image: docker:cli
    entrypoint: ["sh", "/updater/updater.sh"]
    environment:
      - HOST_HOME=${HOME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./updater:/updater:ro
      - ~/.ssh:/state
    restart: unless-stopped
