# Pass the original scheme through when a reverse proxy (TLS) sits in front,
# so the backend can mark its login cookie Secure on https.
map $http_x_forwarded_proto $sd_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Look the backend up again every few seconds (Docker's DNS): an update that only
    # replaces the backend gives it a new address, and a name resolved once at start
    # would keep pointing at the old one (502 until the frontend restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sd_backend http://backend:5000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $sd_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $sd_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    # The pages and auth.js always get revalidated (a cheap 304 when unchanged),
    # so a browser never mixes a new page with an old cached script after an
    # update. add_header here replaces the server-level ones, hence the repeats.
    location /callback {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri /index.html;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
